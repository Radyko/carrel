# Builds a release when a version tag is pushed (npm version patch, then
# git push --follow-tags). It attaches ready-made apps for macOS and Linux,
# the installer and latest.json to a GitHub release, which is what
# `curl -fsSL radyko.github.io/carrel/install | sh` and the app's Update
# button download. It also publishes to npm when an NPM_TOKEN secret is set.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/package-app.js --arch arm64 --out release
      - run: node scripts/package-app.js --arch x64 --out release
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/package-app.js --arch x64 --out release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  release:
    needs: [mac, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
          cp scripts/install.sh release/install.sh
          printf '{"version":"%s"}\n' "$version" > release/latest.json
          ls -la release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Carrel ${GITHUB_REF_NAME#v}" --generate-notes

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm (when an NPM_TOKEN secret is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret; skipping npm. Run npm publish yourself if you want it there too."
            exit 0
          fi
          npm publish --access public
