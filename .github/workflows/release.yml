# Releases Carrel when a merge to main changes the version in package.json:
# a PR that should reach people bumps the version, and merging it is all it
# takes. It attaches ready-made apps for macOS and Linux, the installer and
# latest.json to a GitHub release tagged v<version>, which is what
# `curl -fsSL radyko.github.io/carrel/install | sh` and the app's Update
# button download. It also publishes to npm when an NPM_TOKEN secret is set.
# Changing this file runs it too. A version that already has a release is
# skipped, so those runs and other merges do nothing.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  mac:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/package-app.js --arch arm64 --out release
      - run: node scripts/package-app.js --arch x64 --out release
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: release/*

  linux:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/package-app.js --arch x64 --out release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  release:
    needs: [version, mac, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Add the installer and latest.json
        run: |
          cp scripts/install.sh release/install.sh
          printf '{"version":"%s"}\n' "$VERSION" > release/latest.json
          ls -la release
      - name: Create the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" release/* --target "$GITHUB_SHA" --title "Carrel $VERSION" --generate-notes

  # Also runs when the GitHub release already exists, so re-running the
  # workflow publishes a version that didn't reach npm the first time.
  npm:
    needs: [version, release]
    if: always() && needs.version.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Publish to npm (when an NPM_TOKEN secret is set)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "No NPM_TOKEN secret; skipping npm. Run npm publish yourself if you want it there too."
            exit 0
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "@radyko/carrel@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$version is already on npm."
            exit 0
          fi
          npm publish --access public
