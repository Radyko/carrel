# Publishes site/ (the page at radyko.github.io/carrel and its short
# installer address, /install) to GitHub Pages. Turn Pages on once under
# Settings → Pages → Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/banner.png', 'assets/icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp assets/banner.png assets/icon.png site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
