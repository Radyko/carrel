# Carrel reading guide
#
# This file describes the reading method Carrel guides you through: the
# stages, their goals and target times, checklists, questions, decisions,
# reading purposes, and review intervals. Carrel draws its notes panel from
# this file, so you can change the method by editing it.
#
# Things to know before editing:
# - `heading` values are the schema of your notes files. Each answer is stored
#   in notes.md under the heading of its stage (a level-1 "#" heading) and of
#   its question (a level-2 "##" heading). If you rename a heading here, answers
#   saved under the old heading are kept in the file and shown read-only under
#   "Other notes".
# - `id` values are stored in the front matter of notes files (for example the
#   decision you made after each pass). Keep them stable.
# - If this file is missing or invalid, Carrel uses its built-in guide and says
#   so in the window. Delete this file and use "Restore default guide" in
#   Settings to get the original back.

version: 1
name: Three passes

# Free-form notes shown below the questions on every tab, the section that
# holds your PDF highlights, and the section that review results are appended to.
notes_heading: Notes
highlights_heading: Highlights
reviews_heading: Reviews

purpose:
  id: purpose
  title: Purpose
  heading: Purpose
  target: Under a minute
  goal: Why are you reading this, and what do you want from it? Your answer decides how deep to go.
  choice:
    label: Why am I reading this?
    options:
      - id: course
        label: Assigned for a course
        suggested_pass: 2
      - id: survey
        label: Surveying an area
        suggested_pass: 1
      - id: build
        label: I might build on this
        suggested_pass: 3
      - id: review
        label: Reviewing or presenting it
        suggested_pass: 3
      - id: curiosity
        label: Curiosity
        suggested_pass: 1
  questions:
    - id: questions
      heading: What do I want to get out of it?
      label: What do I want to get out of it?
      help: One to three questions of your own. They stay at the top of every pass.
      type: long
      purpose_questions: true

passes:
  - id: pass1
    pass: 1
    title: Survey
    heading: "Pass 1: Survey"
    goal: Get the big picture, then decide whether it's worth reading further.
    target:
      label: 5 to 10 minutes
      minutes: 10
    # `spotlight` lights up those parts of the PDF while you do the step, and
    # dims the rest. Parts: title, abstract, introduction, conclusion,
    # headings, figures, references.
    checklist:
      - id: abstract
        text: Title and abstract
        spotlight: [title, abstract]
      - id: conclusion
        text: Introduction and conclusion
        spotlight: [introduction, conclusion]
      - id: headings
        text: Section headings
        spotlight: [headings]
      - id: figures
        text: Figures and tables
        spotlight: [figures]
      - id: references
        text: Skim the references
        spotlight: [references]
    questions:
      - id: category
        heading: Category
        help: What kind of paper is this?
        type: short
      - id: context
        heading: Context
        help: What does it build on, or respond to?
        type: short
      - id: correctness
        heading: Correctness
        help: Do the assumptions seem reasonable?
        type: short
      - id: contributions
        heading: Contributions
        help: What does it claim to add?
        type: short
      - id: summary
        heading: Summary after pass 1
        help: From memory, in two or three sentences, what is it about and what does it claim?
        type: long
        recall: true
        summary: true
    decision:
      prompt: What next?
      options:
        - id: continue
          label: Continue to pass 2
          next: pass2
          status: in-progress
        - id: later
          label: Come back later
          status: in-progress
        - id: stop
          label: Stop here
          status: read
          help: Stopping after a survey is a normal, successful outcome for most papers.

  - id: pass2
    pass: 2
    title: Comprehend
    heading: "Pass 2: Comprehend"
    goal: Understand it well enough to explain it to someone else, without getting stuck on details.
    target:
      label: Up to 1 hour
      minutes: 60
    checklist:
      - id: read
        text: Read it all, skipping proofs and fine detail
      - id: figures
        text: Study the figures and tables
      - id: references
        text: Note references to follow up
    questions:
      - id: problem
        heading: Problem
        help: What problem does it tackle, and why does it matter?
        type: short
      - id: approach
        heading: Approach
        help: What did the authors do? What's the key idea?
        type: short
      - id: results
        heading: Results
        help: What did they find, and what's the evidence?
        type: short
      - id: conclusion
        heading: Conclusion
        help: Do the results support the conclusions?
        type: short
      - id: references
        heading: References to chase
        help: One per line; tick them off as you read them.
        type: checklist
      - id: terms
        heading: Terms I didn't know
        help: A term and what it means.
        type: terms
      - id: summary
        heading: Summary after pass 2
        help: From memory, explain the main idea and the evidence for it, as if to a friend.
        type: long
        recall: true
        summary: true
      - id: answered
        heading: Did I get what I came for?
        help: Were your questions answered?
        type: short
        show_purpose_questions: true
    decision:
      prompt: What next?
      options:
        - id: continue
          label: Continue to pass 3
          next: pass3
          status: in-progress
        - id: later
          label: Come back later
          status: in-progress
          note:
            id: background
            heading: Background I need first
            label: What do you need to learn first? (optional)
        - id: set-aside
          label: Set aside
          status: set-aside
        - id: done
          label: Done
          status: read
          schedule_review: true

  - id: pass3
    pass: 3
    title: Reconstruct
    heading: "Pass 3: Reconstruct"
    goal: Rebuild the work in your head, then compare it with what the authors did to find its strengths and weak spots.
    target:
      label: 1 to 5 hours
      minutes: 300
    checklist: []
    questions:
      - id: assumptions
        heading: Assumptions
        help: What does it assume, stated or not? Which would you challenge?
        type: long
      - id: strengths-weaknesses
        heading: Strengths and weaknesses
        help: What is convincing, and what isn't?
        type: long
      - id: differently
        heading: What I would do differently
        help: How would you have approached or tested it?
        type: long
      - id: ideas
        heading: Ideas and connections
        help: How does it connect to other work you know, and what would you try next?
        type: long
    decision:
      prompt: When you have finished
      options:
        - id: done
          label: Done
          status: read
          schedule_review: true

review:
  # Days until the next review. After "Done" at a pass that schedules review,
  # the paper is due after the first interval. "Remembered" moves to the next
  # interval; "Fuzzy" repeats the current one. After the last interval is
  # remembered, the paper leaves the schedule.
  intervals: [7, 30, 90]
  target: About two minutes
  prompt: What do you remember?
  help: Without opening the paper, write down the main idea and the evidence for it.
  outcomes:
    remembered: Remembered
    fuzzy: Fuzzy
