<!doctype html>
<!-- Source of banner.png, the picture at the top of the README. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: transparent; }
  .banner {
    width: 1280px; height: 400px; box-sizing: border-box;
    border-radius: 28px; overflow: hidden;
    background: radial-gradient(ellipse at 28% 40%, #0f4a8a 0%, #00356b 45%, #00264d 100%);
    display: flex; align-items: center; gap: 56px; padding: 0 110px;
    color: #f3ead6;
  }
  img { width: 230px; height: 230px; flex: none; filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.35)); }
  h1 {
    margin: 0; font: 400 112px/1 'Bitstream Charter', Charter, Georgia, serif;
    letter-spacing: 0.5px;
  }
  .rule { width: 72px; height: 3px; background: #e9c77b; margin: 26px 0 22px; border-radius: 2px; }
  p { margin: 0; font: italic 34px/1.3 'Bitstream Charter', Charter, Georgia, serif; color: #d9cfb9; }
</style></head>
<body><div class="banner">
  <img src="icon.svg" alt="">
  <div>
    <h1>Carrel</h1>
    <div class="rule"></div>
    <p>A quiet study desk for reading research papers.</p>
  </div>
</div></body></html>
